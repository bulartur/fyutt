# fyutt.com — server block for the nginx in the palker-nginx container.
#
# Install:  /opt/palker/docker/nginx/conf.d/fyutt.com.conf
# Then:     sudo docker exec palker-nginx nginx -t     <- always first
#           sudo docker exec palker-nginx nginx -s reload
#
# This is the reference copy: change it here and commit, then copy it over.

server {
    listen 80;
    listen [::]:80;
    server_name fyutt.com www.fyutt.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://fyutt.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.fyutt.com;

    ssl_certificate     /etc/letsencrypt/live/fyutt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fyutt.com/privkey.pem;

    return 301 https://fyutt.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fyutt.com;

    ssl_certificate     /etc/letsencrypt/live/fyutt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fyutt.com/privkey.pem;

    # A send URL carries the client's key in its query string. An access log
    # would keep every key in plain text, so there is none. Errors only.
    access_log off;
    error_log  /var/log/nginx/fyutt.error.log warn;

    # A message is at most 4096 characters; the app itself stops at 64 KB.
    client_max_body_size 128k;

    # Security headers are set by the application; do not duplicate them.

    location / {
        proxy_pass http://fyutt-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}
